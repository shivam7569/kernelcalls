[project]
name = "kernelcalls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "ruff>=0.16.8",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
kernelcalls = "kernelcalls:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]


# import-linter settings

[tool.importlinter]
root_package = "kernelcalls"

# Contract 1: Core is foundation; multimodal can import from vision, language or core; vision and language can import from core
[[tool.importlinter.contracts]]
name = "Core is foundational"
type = "layers"
layers = [
    "kernelcalls.multimodal",
    "kernelcalls.vision | kernelcalls.language",
    "kernelcalls.core"
]

# Contract 2: vision and language models are independent and cannot import from each other
[[tool.importlinter.contracts]]
name = "Domain modules are independent"
type = "independence"
modules = [
    "kernelcalls.vision",
    "kernelcalls.language"
]

# mypy settings

[tool.mypy]
python_version = 3.13
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "cv2.*"
]
ignore_missing_imports = true
